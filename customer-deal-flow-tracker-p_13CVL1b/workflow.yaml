schema: workflow/2022.04
name: Customer Deal Flow Tracker
settings:
  error_notification: true
  lambda_memory: 512
  lambda_timeout: 750
steps:
- namespace: get_hubspot_contacts
  runtime: nodejs20.x
  uses: "./get_hubspot_contacts/entry.js"
  props:
    hubspot:
      authProvisionId: apn_b6hVBB6
    listId: '11'
    limit: 100
- namespace: search_email_threads
  runtime: nodejs20.x
  uses: "./search_email_threads/entry.js"
  props:
    gmail:
      authProvisionId: apn_arhpnm0
    emailAddresses: "{{steps.get_hubspot_contacts.$return_value.emails}}"
- namespace: analyze_contact_status
  runtime: nodejs20.x
  uses: "./analyze_contact_status/entry.js"
  props:
    emailThreads: "{{steps.search_email_threads.$return_value}}"
    model: gpt-4o
- namespace: send_slack_notification
  runtime: nodejs20.x
  uses: slack-send-message-to-channel
  props:
    slack:
      authProvisionId: apn_kVhoygA
    channel:
      __lv:
        label: 'Public channel: sales-briefer-ai'
        value: C09AFE3BQ0J
    contacts: "{{ steps.analyze_contact_status.$return_value.contacts.map(contact
      => { const hubspotContact = steps.get_hubspot_contacts.$return_value.contacts.find(hc
      => hc.email === contact.email); const name = hubspotContact ? `${hubspotContact.firstName}
      ${hubspotContact.lastName}`.trim() : contact.email; return JSON.stringify({
      name: name || contact.email, email: contact.email, status: contact.status, lastContactedDate:
      contact.lastCheckinDate || 'Unknown' }); }) }}"

