schema: workflow/2022.04
name: Customer Deal Flow Tracker
settings:
  error_notification: true
  lambda_memory: 2048
  lambda_timeout: 750
triggers:
- id: hi_eqHNdXG
steps:
- namespace: get_hubspot_contacts
  runtime: nodejs20.x
  uses: "./get_hubspot_contacts/entry.js"
  props:
    hubspot:
      authProvisionId: apn_b6hVBB6
    listId: '11'
    offset: 0
    limit: 100
- namespace: search_email_threads
  runtime: nodejs20.x
  uses: "./search_email_threads/entry.js"
  props:
    gmail:
      authProvisionId: apn_vMhjLBk
    emailAddresses: "{{steps.get_hubspot_contacts.$return_value.emails}}"
    includeTestEmail: false
    searchDays: 120
    maxThreadsPerEmail: 50
    maxPagesPerEmail: 3
    concurrency: 5
- namespace: analyze_contact_status
  runtime: nodejs20.x
  uses: "./analyze_contact_status/entry.js"
  props:
    openai:
      authProvisionId: apn_JjhyPbJ
    emailThreads: "{{steps.search_email_threads.$return_value.resultsByEmail}}"
    model: gpt-4o
    maxMessagesPerThread: 15
    maxCharsPerThread: 10000
- namespace: REminder_Tracker
  runtime: nodejs20.x
  uses: "./REminder_Tracker/entry.js"
  props:
    openai:
      authProvisionId: apn_JjhyPbJ
    emailThreads: "{{steps.search_email_threads.$return_value.resultsByEmail}}"
    model: gpt-4o
    maxMessagesPerThread: 15
    maxCharsPerThread: 10000
- namespace: update_reminders
  runtime: nodejs20.x
  uses: "./update_reminders/entry.js"
  props:
    hubspot:
      authProvisionId: apn_b6hVBB6
    contactsInput: "{{steps.REminder_Tracker.$return_value.contacts}}"
    followUpDateProperty: follow_up_date
    followUpMessageProperty: follow_up_message
- namespace: hubspot
  runtime: nodejs20.x
  uses: "./hubspot/entry.js"
  props:
    hubspot:
      authProvisionId: apn_b6hVBB6
    contactsInput: "{{steps.analyze_contact_status.$return_value.contacts}}"
    statusPropertyLabel: Email Status
    onlyUpdateOpenDeals: false

